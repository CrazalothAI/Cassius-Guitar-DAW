name: Windows build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # publish the "latest" release from main
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - shell: pwsh
        run: ./scripts/setup-webview2.ps1
      - shell: pwsh
        run: ./scripts/setup-asio.ps1
      - run: cmake --preset windows
      - run: cmake --build --preset release --parallel 2
      - run: ctest --preset release
      - name: Build Windows installer and portable download
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Cassian-Windows
          if-no-files-found: error
          path: |
            Cassian-Setup.exe
            Cassian-Windows.zip
      # Every push to main replaces the "latest" pre-release, so the newest
      # Cassian.exe and VST3 are always one click away on the Releases page.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --yes --cleanup-tag }
          $notes = "Built from ${{ github.sha }}.`n`nDownload Cassian-Setup.exe and run it to install Cassian, shortcuts and the optional VST3 plugin. Setup installs Microsoft WebView2 if needed (internet required for that step).`n`nFor portable use, extract Cassian-Windows.zip and run Cassian.exe at the top of the folder. The GitHub source ZIP is for developers."
          gh release create latest Cassian-Setup.exe Cassian-Windows.zip --prerelease --title "Latest Windows download" --target ${{ github.sha }} --notes $notes

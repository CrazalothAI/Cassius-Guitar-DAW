name: Windows build
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # publish the "latest" release from main
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm test
        working-directory: ui
      - name: Test signing configuration and verification
        shell: pwsh
        run: ./scripts/test-windows-signing.ps1
      - name: Test release artifact cleanup
        shell: pwsh
        run: ./scripts/test-release-artifacts.ps1
      - name: Test native failure reporting
        shell: pwsh
        run: ./scripts/test-native-test-report.ps1
      - name: Read release version
        id: version
        shell: pwsh
        run: |
          . ./scripts/ReleaseVersion.ps1
          $version = Get-CassianVersion $PWD
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match the app version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - shell: pwsh
        run: ./scripts/setup-webview2.ps1
      - shell: pwsh
        run: ./scripts/setup-asio.ps1
      - run: cmake --preset windows
      - run: cmake --build --preset release --parallel 4
      - name: Run native tests
        id: native_tests
        shell: pwsh
        run: |
          ctest --preset release --output-junit native-test-results.xml
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) {
            try {
              . ./scripts/NativeTestReport.ps1
              Get-CassianNativeFailureAnnotations build/native-test-results.xml | ForEach-Object { Write-Output $_ }
            } catch { Write-Output '::error title=Native test failure::CTest failed; inspect the retained native logs for details.' }
          }
          exit $testExitCode
      - name: Save native test evidence
        if: always() && steps.native_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: Cassian-Native-Validation
          if-no-files-found: warn
          path: |
            build/native-test-results.xml
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
      - name: Validate actual VST3 with independent host tests
        shell: pwsh
        run: ./scripts/test-vst3-plugin.ps1
      - name: Save plugin validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Cassian-Plugin-Validation
          if-no-files-found: warn
          path: |
            build/plugin-validation/PLUGIN-VALIDATION.json
            build/plugin-validation/**/validation.txt
            build/plugin-validation/**/stdout.txt
            build/plugin-validation/**/stderr.txt
      - shell: pwsh
        run: ./scripts/test-release-version.ps1
      - name: Build Windows installer and portable download
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Release
      - name: Test installation, upgrade and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - name: Verify binaries and matching source
        shell: pwsh
        run: ./scripts/test-package-integrity.ps1
      - name: Record commercial release readiness
        shell: pwsh
        run: |
          $channel = Get-Content ui/src/release.json -Raw | ConvertFrom-Json
          ./scripts/test-release-readiness.ps1 -RequireReady:($channel.channel -eq 'stable')
      - uses: actions/upload-artifact@v5
        with:
          name: Cassian-Windows
          if-no-files-found: error
          path: |
            build/releases/${{ steps.version.outputs.value }}/Cassian-Setup.exe
            build/releases/${{ steps.version.outputs.value }}/Cassian-${{ steps.version.outputs.value }}-Windows.zip
            build/releases/${{ steps.version.outputs.value }}/Cassian-${{ steps.version.outputs.value }}-Source.zip
            build/releases/${{ steps.version.outputs.value }}/RELEASE-READINESS.json
            build/releases/${{ steps.version.outputs.value }}/Cassian-Build.json
            build/releases/${{ steps.version.outputs.value }}/SHA256SUMS.txt
      # Every push to main replaces the "latest" pre-release, so the newest
      # Cassian.exe and VST3 are always one click away on the Releases page.
      - name: Publish latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CASSIAN_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $currentMain = & git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or !$currentMain) { throw 'Cannot verify the current main revision before publishing.' }
          if (($currentMain -split '\s+')[0] -ne '${{ github.sha }}') {
            Write-Host 'A newer main revision exists; skipping replacement of the latest download.'
            exit 0
          }
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw 'Cannot replace the previous latest release.' }
          }
          $notes = "Cassian $env:CASSIAN_VERSION preview. Built from ${{ github.sha }}.`n`nDownload Cassian-Setup.exe and run it to install Cassian, shortcuts and the optional VST3 plugin. This is the only installer in this release. Setup installs Microsoft WebView2 if needed (internet required for that step).`n`nFor portable use, extract Cassian-$env:CASSIAN_VERSION-Windows.zip and run Cassian.exe at the top of the folder. The GitHub source ZIP is for developers.`n`nSHA256SUMS.txt and Cassian-Build.json identify this download. Includes 22 original rigs. Private third-party capture files are excluded. Matching source is supplied under AGPL-3.0-or-later. This is a preview; signing and acceptance items are listed in RELEASE-READINESS.json."
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          $package = "build/releases/$env:CASSIAN_VERSION"
          $assets = @('Cassian-Setup.exe',"Cassian-$env:CASSIAN_VERSION-Windows.zip","Cassian-$env:CASSIAN_VERSION-Source.zip",'RELEASE-READINESS.json','Cassian-Build.json','SHA256SUMS.txt') | ForEach-Object { Join-Path $package $_ }
          gh release create latest @assets --prerelease --title "Latest Windows download" --target ${{ github.sha }} --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Latest release publication failed.' }
      - name: Publish versioned preview
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CASSIAN_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $notes = "Cassian $env:CASSIAN_VERSION preview, built from ${{ github.sha }}. Download Cassian-Setup.exe for installation or the versioned Windows.zip for portable use. This release contains one installer. SHA256SUMS.txt and Cassian-Build.json accompany these files. Matching AGPL source is included. Owner reports most sounds auditioned; remaining signing/acceptance checks are listed in RELEASE-READINESS.json."
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          $package = "build/releases/$env:CASSIAN_VERSION"
          $assets = @('Cassian-Setup.exe',"Cassian-$env:CASSIAN_VERSION-Windows.zip","Cassian-$env:CASSIAN_VERSION-Source.zip",'RELEASE-READINESS.json','Cassian-Build.json','SHA256SUMS.txt') | ForEach-Object { Join-Path $package $_ }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --prerelease --title "Cassian $env:CASSIAN_VERSION preview" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Versioned release publication failed.' }

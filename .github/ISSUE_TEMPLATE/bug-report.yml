name: Bug report
description: Report a reproducible Cassian problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup and support report
      description: Add your OS, interface/driver and DAW versions. Help & setup can copy audio settings; review device names before posting. Do not post recordings, private file paths, credentials or private captures without permission.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cassian version
      placeholder: 1.0.0 RC1
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: App mode
      options:
        - Windows standalone
        - VST3 in a DAW
        - Source build on another platform
    validations:
      required: true
